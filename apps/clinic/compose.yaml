# Local dev stack: docker compose up --build   ->  http://localhost:3000
services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinic}
      POSTGRES_DB: clinic
    ports: ["127.0.0.1:${DB_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: ../.., dockerfile: apps/clinic/Dockerfile }
    image: clinic:local
    command: ["node", "scripts/migrate.mjs"]
    environment: &app-env
      DATABASE_URL: postgres://clinic:${POSTGRES_PASSWORD:-clinic}@db:5432/clinic
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-local}
      SESSION_SECRET: ${SESSION_SECRET:-local-session-secret-not-for-production}
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  app:
    image: clinic:local
    environment: *app-env
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/ready"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
