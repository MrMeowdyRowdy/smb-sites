name: sites

# One pipeline for every app in apps/. Checks run on every change to an app (or to
# anything shared). Deploy is off unless the repo variable DEPLOY_ENABLED is 'true',
# and then runs only from a manual run with "deploy" ticked or a push to staging.
on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:
    inputs:
      app:
        description: App to check and deploy (empty means all)
        type: string
        default: ''
      deploy:
        description: Deploy to the demo server
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
      clinic: ${{ steps.list.outputs.clinic }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3.0.2
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            shared:
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'eslint.config.mjs'
              - '.nvmrc'
              - '.github/workflows/sites.yml'
            restaurant:
              - 'apps/restaurant/**'
            clinic:
              - 'apps/clinic/**'
      - id: list
        env:
          EVENT: ${{ github.event_name }}
          INPUT_APP: ${{ inputs.app }}
          SHARED: ${{ steps.filter.outputs.shared }}
          RESTAURANT: ${{ steps.filter.outputs.restaurant }}
          CLINIC: ${{ steps.filter.outputs.clinic }}
        run: |
          # apps: the static sites (check + deploy matrix). clinic: the server app, which has its own jobs.
          ALL='["restaurant"]'
          clinic=false
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ -z "$INPUT_APP" ]; then apps="$ALL"; clinic=true
            elif [ "$INPUT_APP" = clinic ]; then apps='[]'; clinic=true
            else apps="[\"$INPUT_APP\"]"; fi
          elif [ "$SHARED" = true ]; then
            apps="$ALL"; clinic=true
          else
            apps='[]'
            [ "$RESTAURANT" = true ] && apps='["restaurant"]'
            [ "$CLINIC" = true ] && clinic=true
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "clinic=$clinic" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint -w apps/${{ matrix.app }}
      - run: npm run typecheck -w apps/${{ matrix.app }}
      - run: npm run test:unit -w apps/${{ matrix.app }}
      - run: npm run build -w apps/${{ matrix.app }}
      - run: npx playwright install --with-deps chromium
      - name: Playwright and axe (static build served from out/)
        run: npm run test:e2e -w apps/${{ matrix.app }}
      - name: Lighthouse CI
        run: npm run lhci -w apps/${{ matrix.app }}
      - name: Quality report, then rebuild so the pages show this commit's checks
        run: |
          npm run report -w apps/${{ matrix.app }}
          npm run build -w apps/${{ matrix.app }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.app }}
          path: |
            apps/${{ matrix.app }}/lhci/
            apps/${{ matrix.app }}/playwright-report/
      - uses: actions/upload-artifact@v4
        with:
          name: quality-${{ matrix.app }}
          path: apps/${{ matrix.app }}/content/quality.json

  # The clinic is a Node server with a Postgres, so it does not share the static-site job above.
  check-clinic:
    needs: changes
    if: needs.changes.outputs.clinic == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic
          POSTGRES_DB: clinic
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://clinic:clinic@127.0.0.1:5433/clinic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint -w apps/clinic
      - run: npm run typecheck -w apps/clinic
      - run: npm run test:unit -w apps/clinic
      - name: Standalone build
        run: npm run build -w apps/clinic
      - run: npx playwright install --with-deps chromium
      - name: Playwright and axe (standalone server, migrations, Postgres service)
        run: npm run test:e2e -w apps/clinic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-clinic
          path: apps/clinic/playwright-report/

  # Push the image only from the default branch, after the checks pass. The package must be made public once in GitHub.
  image-clinic:
    needs: [changes, check-clinic]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/clinic/Dockerfile
          push: true
          tags: ghcr.io/mrmeowdyrowdy/clinic:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [changes, check]
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && inputs.deploy) ||
       (github.event_name == 'push' && github.ref == 'refs/heads/staging'))
    runs-on: ubuntu-latest
    environment: demo
    concurrency: deploy-${{ matrix.app }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
        include:
          - app: restaurant
            site_user: ${{ vars.RESTAURANT_SITE_USER }}
            host_prefix: restaurant
            whatsapp: ${{ vars.RESTAURANT_WHATSAPP }}
          # Future app (Node standalone): build with output 'standalone', rsync the build,
          # then `pm2 reload clinic` over SSH instead of serving out/ statically.
          # - app: clinic
          #   site_user: ${{ vars.CLINIC_SITE_USER }}
          #   host_prefix: clinic
    env:
      DOMAIN: ${{ github.ref == 'refs/heads/staging' && 'staging.' || '' }}${{ matrix.host_prefix }}.${{ vars.DEMO_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: quality-${{ matrix.app }}
          path: apps/${{ matrix.app }}/content
      - name: Mark the report as deployed, then build for the real domain
        env:
          NEXT_PUBLIC_SITE_URL: https://${{ env.DOMAIN }}
          NEXT_PUBLIC_WHATSAPP: ${{ matrix.whatsapp }}
        run: |
          node -e 'const f=process.argv[1],q=JSON.parse(require("fs").readFileSync(f));q.deploy={url:process.argv[2]};require("fs").writeFileSync(f,JSON.stringify(q,null,2)+"\n")' \
            apps/${{ matrix.app }}/content/quality.json "https://$DOMAIN/"
          npm run build -w apps/${{ matrix.app }}
      - name: SSH key and pinned host key
        env:
          KEY: ${{ secrets.DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Sync the static export
        env:
          TARGET: ${{ matrix.site_user }}@${{ secrets.DEPLOY_HOST }}:/home/${{ matrix.site_user }}/htdocs/${{ env.DOMAIN }}/
        run: rsync -az --delete apps/${{ matrix.app }}/out/ "$TARGET"
      - name: Smoke check
        run: |
          for p in / /en/ /menu/; do curl -fsS -o /dev/null "https://$DOMAIN$p"; done
      - name: Lighthouse against the live site
        run: >-
          CHROME_PATH=/usr/bin/google-chrome npx -y @lhci/cli@0.14.0 autorun
          --config=apps/${{ matrix.app }}/lighthouserc.json
          --collect.staticDistDir=
          --collect.url="https://$DOMAIN/" --collect.url="https://$DOMAIN/menu/" --collect.url="https://$DOMAIN/en/"
          --upload.outputDir=lhci-live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-live-${{ matrix.app }}
          path: lhci-live/
